# 服务器配置
server:
  port: 8080

# Spring 配置
spring:
  # 数据库配置
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:db/dorm_repair.db
    username:
    password:

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto